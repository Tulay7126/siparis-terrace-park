<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terrace Park Komuta Merkezi</title>
    <style>
        /* GENEL TASARIM VE RENKLER */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0a0a0a; color: white; font-family: sans-serif; 
            overflow: hidden; height: 100vh; display: flex; flex-direction: column; 
        }
        .header { background: #1a1a1a; padding: 10px; text-align: center; border-bottom: 2px solid #ffcc00; }
        h1 { font-size: 18px; color: #ffcc00; }

        /* DAİRE LİSTESİ (1.5 KAT GENİŞLİK AYARI) */
        #ana-liste { display: flex; flex: 1; gap: 2px; padding: 2px; height: 90vh; }
        .blok-konteyner { flex: 1; display: flex; flex-direction: column; background: #111; border: 1px solid #333; }
        h2 { font-size: 14px; text-align: center; background: #222; padding: 5px; color: #ffcc00; }

        /* DAİRE BUTONLARI */
        .daire-btn { 
            flex: 1; margin: 1px; font-size: 11px; font-weight: bold;
            background: #262626; color: #ccc; border: 1px solid #444; 
            cursor: pointer; border-radius: 4px;
        }
        .daire-btn:active { background: #444; }

        /* SEÇİM PANELİ (MODAL) */
        #modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); display: none; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 999;
        }
        .modal-icerik { background: #222; padding: 40px; border-radius: 20px; border: 2px solid #ffcc00; text-align: center; width: 90%; }
        .urun-secenekler { display: flex; gap: 20px; margin: 20px 0; }
        .urun-btn { 
            flex: 1; padding: 30px; font-size: 24px; cursor: pointer; 
            background: #333; color: white; border: 4px solid #444; border-radius: 15px; 
        }
        .tamam-btn { 
            background: #28a745; color: white; padding: 20px 80px; 
            margin-top: 20px; border: none; border-radius: 10px; font-size: 24px; font-weight: bold; 
        }
    </style>
</head>
<body>
    <div class="header"><h1>🏢 Terrace Park Komuta</h1></div>
    <div id="ana-liste"></div>

    <div id="modal">
        <div class="modal-icerik">
            <h3 id="secim-baslik" style="font-size: 26px; color: #ffcc00; margin-bottom: 20px;">HANGİSİNİ SEÇ?</h3>
            <div class="urun-secenekler">
                <button class="urun-btn" onclick="urunSec('Su', this)">💧 SU</button>
                <button class="urun-btn" onclick="urunSec('Ekmek', this)">🍞 EKMEK</button>
            </div>
            <button class="tamam-btn" onclick="tamamDe()">TAMAM</button>
        </div>
    </div>

    <script src="terracesiparis.js"></script>
</body>
</html>
