<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terrace Park</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0a; color: white; font-family: sans-serif; overflow-y: auto; height: 100vh; }
        
        /* BLOKLARIN DÜZENİ */
        #ana-liste { display: block; padding: 10px; }
        .blok-konteyner { margin-bottom: 20px; background: #111; border: 1px solid #333; border-radius: 8px; padding: 10px; }
        h2 { font-size: 22px; text-align: center; color: #ffcc00; margin-bottom: 10px; border-bottom: 1px solid #333; }

        /* BUTONLAR: KOCAMAN VE BASMASI KOLAY */
        .daire-btn { 
            width: 100%; height: 60px; margin-bottom: 8px; font-size: 20px; font-weight: bold;
            background: #262626; color: #ccc; border: 2px solid #444; border-radius: 10px; 
        }
        
        /* SEÇİM PANELİ */
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
        .modal-icerik { background: #222; padding: 30px; border-radius: 20px; border: 2px solid #ffcc00; text-align: center; width: 90%; }
        .urun-secenekler { display: flex; gap: 15px; margin: 25px 0; }
        .urun-btn { flex: 1; padding: 30px; font-size: 24px; font-weight: bold; cursor: pointer; background: #333; color: white; border: 4px solid #444; border-radius: 15px; }
        .tamam-btn { background: #28a745; color: white; width: 100%; padding: 20px; border: none; border-radius: 12px; font-size: 26px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ana-liste"></div>

    <div id="modal">
        <div class="modal-icerik">
            <h3 id="secim-baslik" style="font-size: 26px; color: #ffcc00; margin-bottom: 20px;">SEÇİM YAPIN</h3>
            <div class="urun-secenekler">
                <button class="urun-btn" onclick="urunSec('Su', this)">💧 SU</button>
                <button class="urun-btn" onclick="urunSec('Ekmek', this)">🍞 EKMEK</button>
            </div>
            <button class="tamam-btn" onclick="tamamDe()">TAMAM</button>
        </div>
    </div>

    <script>
        // REDMİ 14C KONTROLÜ
        const isTulayAdmin = navigator.userAgent.includes("Redmi 14C");
        let secilenBlok = "", secilenDaire = "", secilenUrun = "";

        function secimAc(blok, daire) {
            secilenBlok = blok; secilenDaire = daire;
            document.getElementById('secim-baslik').innerText = blok + daire + " SEÇİMİ";
            document.getElementById('modal').style.display = 'flex';
            if (Notification.permission !== "granted") Notification.requestPermission();
        }

        function urunSec(urun, btn) {
            secilenUrun = urun;
            document.querySelectorAll('.urun-btn').forEach(b => b.style.borderColor = '#444');
            btn.style.borderColor = '#ffcc00';
        }

        function tamamDe() {
            if (!secilenUrun) { alert("Lütfen ürün seçin!"); return; }
            
            // BİLDİRİM
            if (Notification.permission === "granted") {
                new Notification("TERRACE PARK", {
                    body: secilenBlok + " Blok Daire " + secilenDaire + ": " + secilenUrun.toUpperCase() + " istiyor!",
                    icon: "https://cdn-icons-png.flaticon.com/512/3502/3502214.png"
                });
            }
            
            document.getElementById('modal').style.display = 'none';
            secilenUrun = "";
            alert("Sipariş Tamam!");
        }

        // DAİRELERİ ALT ALTA DİZ (En kolayı bu)
        document.addEventListener('DOMContentLoaded', () => {
            const anaListe = document.getElementById('ana-liste');
            ['A', 'B', 'C', 'D', 'E', 'F'].forEach(ad => {
                const adet = (ad === 'E' || ad === 'F') ? 67 : 46;
                const blokDiv = document.createElement('div');
                blokDiv.className = 'blok-konteyner';
                blokDiv.innerHTML = '<h2>' + ad + ' BLOK</h2>';
                for (let i = 1; i <= adet; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'daire-btn';
                    btn.innerText = ad + i;
                    btn.onclick = () => secimAc(ad, i);
                    blokDiv.appendChild(btn);
                }
                anaListe.appendChild(blokDiv);
            });
        });
    </script>
</body>
</html>
