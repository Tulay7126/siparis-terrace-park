<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terrace Park Sipariş</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; text-align: center; padding: 15px; }
        .adim { display: block; margin-bottom: 20px; }
        .gizli { display: none; }
        
        /* KOCAMAN BUTONLAR */
        button { 
            padding: 20px; margin: 10px; font-size: 20px; font-weight: bold;
            background-color: #222; color: #ffcc00; border: 3px solid #ffcc00; border-radius: 12px;
            cursor: pointer; width: 90%; max-width: 400px;
        }
        button:active { background-color: #ffcc00; color: #000; }
        
        input { padding: 15px; font-size: 22px; width: 120px; border-radius: 10px; text-align: center; margin-bottom: 10px; }
        #sonuc { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 3px solid #28a745; }
    </style>
</head>
<body>

    <h1>🏢 Terrace Park</h1>

    <div id="adim1" class="adim">
        <h3>BLOĞU SEÇİN:</h3>
        <button onclick="adimAtla(1, 2, 'A')">A BLOK</button>
        <button onclick="adimAtla(1, 2, 'B')">B BLOK</button>
        <button onclick="adimAtla(1, 2, 'C')">C BLOK</button>
        <button onclick="adimAtla(1, 2, 'D')">D BLOK</button>
        <button onclick="adimAtla(1, 2, 'E')">E BLOK</button>
        <button onclick="adimAtla(1, 2, 'F')">F BLOK</button>
    </div>

    <div id="adim2" class="adim gizli">
        <h2 id="blok-yazisi" style="color:#ffcc00;"></h2>
        <p>Daire Numarasını Yazın:</p>
        <input type="number" id="daire-input" placeholder="No">
        <br>
        <button onclick="daireKaydet()">DAİREYİ ONAYLA</button>
        <button onclick="iptal()" style="border-color:red; color:red;">VAZGEÇ</button>
    </div>

    <div id="adim3" class="adim gizli">
        <h2 id="ozet-yazisi"></h2>
        <button onclick="final('SU')">💧 SU GÖNDER</button>
        <button onclick="final('EKMEK')">🍞 EKMEK GÖNDER</button>
        <br>
        <button onclick="iptal()" style="border-color:red; color:red;">VAZGEÇ</button>
    </div>

    <div id="adim4" class="adim gizli">
        <div id="sonuc">
            <h2 style="color:#28a745;">SİPARİŞ GİTTİ! ✅</h2>
            <p id="mesaj-yazisi" style="font-size:22px; margin:15px 0;"></p>
            <button onclick="location.reload()" style="background:#28a745; color:white; border:none;">YENİ SİPARİŞ VER</button>
        </div>
    </div>

    <script>
        let secilenBlok = "";
        let secilenDaire = "";

        // Sayfa açılır açılmaz bildirim izni iste
        window.onload = function() {
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        };

        function adimAtla(suanki, sonraki, veri) {
            if(veri) secilenBlok = veri;
            document.getElementById('adim' + suanki).classList.add('gizli');
            document.getElementById('adim' + sonraki).classList.remove('gizli');
            if(veri) document.getElementById('blok-yazisi').innerText = veri + " BLOK";
        }

        function daireKaydet() {
            secilenDaire = document.getElementById('daire-input').value;
            if(!secilenDaire) { alert("Lütfen daire numarasını yazın!"); return; }
            document.getElementById('ozet-yazisi').innerText = secilenBlok + " Blok Daire " + secilenDaire;
            adimAtla(2, 3);
        }

        function final(urun) {
            const tamMesaj = secilenBlok + " Blok No " + secilenDaire + ": " + urun + " İSTİYOR!";
            
            // 🔔 BİLDİRİM BURADA TETİKLENİR
            if (Notification.permission === "granted") {
                new Notification("TERRACE PARK SİPARİŞ", {
                    body: tamMesaj,
                    icon: "https://cdn-icons-png.flaticon.com/512/3502/3502214.png"
                });
            }

            // Ekranda göster
            document.getElementById('adim3').classList.add('gizli');
            document.getElementById('adim4').classList.remove('gizli');
            document.getElementById('mesaj-yazisi').innerText = tamMesaj;
            
            // Eski usul garanti uyarı
            alert("BİLDİRİM GÖNDERİLDİ: " + tamMesaj);
        }

        function iptal() {
            location.reload();
        }
    </script>
</body>
</html>
